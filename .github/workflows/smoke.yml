name: free-zik — tests navigateur Android et Samsung TV
on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://free-zik-creatix5.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Tester les vraies pages HTTPS
        run: node tests/smoke.cjs
      - name: Conserver les captures de diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-zik-diagnostics
          path: tests/screenshots/
          if-no-files-found: ignore
