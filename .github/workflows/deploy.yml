name: Publier free-zik sur GitHub Pages
# GitHub Pages requires enabling Pages once in repository settings.
# Vercel is the production host; avoid failed deploys on every push.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: free-zik-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Charger le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
